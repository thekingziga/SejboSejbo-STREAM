services:
  stream:
    image: thekingziga/sejbosejbo-stream:latest
    # Or build locally from source:
    # build: .
    container_name: sejbosejbo-live
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3030}:3030"
    env_file:
      - .env
    volumes:
      - app_data:/app/data
      - uploads_data:/app/uploads

  # Optional RTMP/HLS ingest relay for OBS Studio / Streamlabs:
  # Point OBS Server to: rtmp://localhost:1935/live
  # And set the channel's HLS URL in /studio to: http://localhost:8888/live/<stream_key>/index.m3u8
  rtmp-hls-relay:
    image: bluenviron/mediamtx:latest
    container_name: sejbosejbo-rtmp
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8888:8888"

volumes:
  app_data:
  uploads_data:
